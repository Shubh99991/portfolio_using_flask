{% extends 'base.html' %}
{% block content %}
<div class="container my-5">
    <h2 class="text-center fw-bold mb-5">Featured Projects</h2>
    <div class="row row-cols-1 row-cols-md-3 g-4">
        {% for project in projects %}
        <div class="col">
            <div class="card h-100 shadow-sm border-0">
                <div class="card-body">
                    <div class="d-flex justify-content-between align-items-start">
                        <h5 class="card-title fw-bold text-dark">{{ project.title }}</h5>
                        <small class="text-muted">{{ project.duration }}</small>
                    </div>
                    <p class="card-text text-muted mt-2">{{ project.desc }}</p>
                    <div class="mt-3">
                        {% for tech in project.tech %}
                        <span class="badge bg-light text-dark border me-1 mb-1">{{ tech }}</span>
                        {% endfor %}
                    </div>
                </div>
            </div>
        </div>
        {% endfor %}
    </div>
</div>
{% endblock %}
